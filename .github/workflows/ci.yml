name: CI

on:
  pull_request:
  push:
    branches:
      - feat/current-status-resolver

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Pytest
        run: pytest tests/ -q

      - name: Ruff
        run: ruff check src/ tests/

      - name: Mypy strict
        run: mypy src/current_status_resolver/
